[project]
name = "vd-jev"
version = "0.1.0"
description = "VisiData plugin: closed questions over a text column with Jev (TypeSafe) via OpenRouter"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Borruso", email = "aborruso@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/ondata/vd-jev"

[project.entry-points."visidata.plugins"]
jev = "vd_jev"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "visidata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: real calls to Jev on OpenRouter; cost money, need OPENROUTER_API_KEY"]
